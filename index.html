<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Wheel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0c29;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --accent: #f7b731;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 14px;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #f7b731, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 960px;
    }

    /* ── Wheel ── */
    .wheel-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    #wheelCanvas {
      display: block;
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(247,183,49,0.25), 0 8px 32px rgba(0,0,0,0.5);
    }

    /* Pointer */
    .pointer {
      position: absolute;
      top: 50%;
      right: -20px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 38px solid #f7b731;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
      z-index: 10;
    }

    /* Center hub */
    .hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #ccc 60%, #999 100%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.8);
      z-index: 10;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .hub:hover { transform: translate(-50%, -50%) scale(1.08); }

    .spin-btn {
      position: absolute;
      bottom: -56px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 44px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #f7b731, #ff6b6b);
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(247,183,49,0.4);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      white-space: nowrap;
    }
    .spin-btn:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 6px 28px rgba(247,183,49,0.55); }
    .spin-btn:active { transform: translateX(-50%) translateY(0); }
    .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: translateX(-50%); }

    /* ── Side panel ── */
    .panel {
      flex: 1;
      min-width: 260px;
      max-width: 340px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-row input {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-row input::placeholder { color: var(--muted); }
    .add-row input:focus { border-color: var(--accent); }

    .add-row button {
      padding: 10px 16px;
      background: var(--accent);
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .add-row button:hover { opacity: 0.85; transform: scale(1.05); }

    #entryList {
      list-style: none;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    #entryList::-webkit-scrollbar { width: 5px; }
    #entryList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    #entryList li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    #entryList li:hover { background: rgba(255,255,255,0.06); }

    .entry-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .entry-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-count {
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 7px;
    }

    .del-btn {
      background: none;
      border: none;
      color: rgba(255,100,100,0.6);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }
    .del-btn:hover { color: #ff6b6b; background: rgba(255,107,107,0.12); }

    .empty-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 24px 0;
    }

    /* ── Result overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.show { opacity: 1; pointer-events: all; }

    .result-card {
      background: linear-gradient(145deg, #1a1a3e, #2d2b55);
      border: 1px solid rgba(247,183,49,0.4);
      border-radius: 20px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      max-width: 380px;
      width: 90%;
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .overlay.show .result-card { transform: scale(1); }

    .result-emoji { font-size: 3rem; margin-bottom: 12px; }
    .result-label { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .result-winner {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 800;
      background: linear-gradient(90deg, #f7b731, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      word-break: break-word;
      margin-bottom: 28px;
    }

    .close-btn {
      padding: 12px 36px;
      background: linear-gradient(135deg, #f7b731, #ff6b6b);
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .close-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(247,183,49,0.4); }

    /* Confetti */
    .confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    @media (max-width: 620px) {
      .layout { gap: 24px; }
      .panel { max-width: 100%; width: 100%; }
      .spin-btn { bottom: -52px; padding: 12px 36px; }
    }
  </style>
</head>
<body>

<h1>Lucky Wheel</h1>
<p class="subtitle">Spin to decide — add your options below</p>

<div class="layout">
  <div class="wheel-wrapper" id="wheelWrapper">
    <canvas id="wheelCanvas" width="360" height="360"></canvas>
    <div class="pointer"></div>
    <div class="hub" id="hub" title="Click to spin"></div>
    <button class="spin-btn" id="spinBtn">Spin!</button>
  </div>

  <div class="panel">
    <h2>Options</h2>
    <div class="add-row">
      <input type="text" id="entryInput" placeholder="Add an option…" maxlength="40" />
      <button id="addBtn" title="Add">+</button>
    </div>
    <ul id="entryList"></ul>
    <p class="empty-hint" id="emptyHint">Add at least 2 options to spin!</p>
  </div>
</div>

<!-- Result overlay -->
<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-emoji">🎉</div>
    <div class="result-label">Winner</div>
    <div class="result-winner" id="resultText"></div>
    <button class="close-btn" id="closeBtn">Close</button>
  </div>
</div>

<canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const PALETTE = [
    '#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c',
    '#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a',
    '#ff5722','#607d8b','#795548','#ff9800','#4caf50',
  ];

  let entries = [];        // { label, color }
  let spinning = false;
  let currentAngle = 0;   // radians, top of wheel = 0

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const canvas      = document.getElementById('wheelCanvas');
  const ctx         = canvas.getContext('2d');
  const spinBtn     = document.getElementById('spinBtn');
  const addBtn      = document.getElementById('addBtn');
  const input       = document.getElementById('entryInput');
  const list        = document.getElementById('entryList');
  const emptyHint   = document.getElementById('emptyHint');
  const overlay     = document.getElementById('overlay');
  const resultText  = document.getElementById('resultText');
  const closeBtn    = document.getElementById('closeBtn');
  const hub         = document.getElementById('hub');

  // ── Initial demo entries ───────────────────────────────────────────────────
  ['Option 1','Option 2','Option 3','Option 4','Option 5','Option 6'].forEach(addEntry);

  // ── Entry management ───────────────────────────────────────────────────────
  function addEntry(label) {
    label = label.trim();
    if (!label) return;
    const color = PALETTE[entries.length % PALETTE.length];
    entries.push({ label, color });
    renderList();
    drawWheel();
    input.value = '';
  }

  function removeEntry(index) {
    entries.splice(index, 1);
    // re-assign colors to keep them sequential
    entries.forEach((e, i) => e.color = PALETTE[i % PALETTE.length]);
    renderList();
    drawWheel();
  }

  function renderList() {
    const hasEntries = entries.length > 0;
    emptyHint.style.display = hasEntries ? 'none' : 'block';
    spinBtn.disabled = entries.length < 2;
    hub.style.cursor = entries.length >= 2 ? 'pointer' : 'default';

    list.innerHTML = '';
    entries.forEach((e, i) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="entry-dot" style="background:${e.color}"></span>
        <span class="entry-label">${escHtml(e.label)}</span>
        <button class="del-btn" data-i="${i}" title="Remove">✕</button>
      `;
      list.appendChild(li);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Wheel drawing ──────────────────────────────────────────────────────────
  function drawWheel(angle) {
    if (angle !== undefined) currentAngle = angle;

    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2, r = cx - 4;
    ctx.clearRect(0, 0, W, H);

    if (entries.length === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#888';
      ctx.font = '16px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Add options to start', cx, cy);
      return;
    }

    const arc = (Math.PI * 2) / entries.length;

    entries.forEach((entry, i) => {
      const start = currentAngle + i * arc - Math.PI / 2;
      const end   = start + arc;

      // Slice
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = entry.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 4;

      const labelR = r * 0.72;
      const maxW   = labelR - 12;
      const text   = entry.label;
      let fontSize = entries.length > 10 ? 10 : 13;
      ctx.font = `bold ${fontSize}px Segoe UI, sans-serif`;

      // truncate if needed
      let display = text;
      while (ctx.measureText(display).width > maxW && display.length > 1) {
        display = display.slice(0, -1);
      }
      if (display !== text) display = display.slice(0, -1) + '…';

      ctx.fillText(display, labelR, 0);
      ctx.restore();
    });

    // Outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // ── Spin logic ─────────────────────────────────────────────────────────────
  function spin() {
    if (spinning || entries.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;

    const totalRotation = (Math.PI * 2) * (8 + Math.random() * 8);
    const duration      = 4000 + Math.random() * 1500;
    const startAngle    = currentAngle;
    const startTime     = performance.now();

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function frame(now) {
      const elapsed  = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const angle    = startAngle + totalRotation * easeOut(progress);
      drawWheel(angle);

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        spinBtn.disabled = false;
        showResult();
      }
    }

    requestAnimationFrame(frame);
  }

  function showResult() {
    // The pointer is on the right side, pointing left toward center.
    // Segment i starts at: currentAngle + i*arc - π/2
    // We need which segment straddles angle 0 (right = 3 o'clock) from center.
    // Pointer is at 3 o'clock (angle 0 from canvas perspective).
    const arc = (Math.PI * 2) / entries.length;
    let pointerAngle = 0; // right of center in standard canvas coords

    // Normalize currentAngle
    const norm = ((currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

    // Segment i covers [currentAngle + i*arc - π/2, currentAngle + (i+1)*arc - π/2]
    // Pointer is at 0 radians (3 o'clock). We need to solve for which i contains 0.
    for (let i = 0; i < entries.length; i++) {
      const segStart = ((norm + i * arc - Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const segEnd   = ((segStart + arc) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

      let hit = false;
      if (segStart < segEnd) {
        hit = pointerAngle >= segStart && pointerAngle < segEnd;
      } else {
        // wraps around
        hit = pointerAngle >= segStart || pointerAngle < segEnd;
      }
      if (hit) {
        resultText.textContent = entries[i].label;
        overlay.classList.add('show');
        launchConfetti();
        return;
      }
    }
    // Fallback
    resultText.textContent = entries[0].label;
    overlay.classList.add('show');
    launchConfetti();
  }

  // ── Confetti ────────────────────────────────────────────────────────────────
  const confCanvas = document.getElementById('confettiCanvas');
  const confCtx    = confCanvas.getContext('2d');
  let confParticles = [];
  let confAnim;

  function launchConfetti() {
    confCanvas.width  = window.innerWidth;
    confCanvas.height = window.innerHeight;
    confParticles = Array.from({ length: 120 }, () => ({
      x:   Math.random() * confCanvas.width,
      y:   -10 - Math.random() * 100,
      vx:  (Math.random() - 0.5) * 4,
      vy:  2 + Math.random() * 4,
      size: 6 + Math.random() * 8,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      rot:  Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.2,
      life: 1,
    }));
    cancelAnimationFrame(confAnim);
    animConfetti();
  }

  function animConfetti() {
    confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
    confParticles = confParticles.filter(p => p.life > 0);
    confParticles.forEach(p => {
      p.x   += p.vx;
      p.y   += p.vy;
      p.vy  += 0.12;
      p.rot += p.vrot;
      p.life = p.y < confCanvas.height ? 1 : 0;

      confCtx.save();
      confCtx.globalAlpha = 0.9;
      confCtx.translate(p.x, p.y);
      confCtx.rotate(p.rot);
      confCtx.fillStyle = p.color;
      confCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      confCtx.restore();
    });
    if (confParticles.length > 0) confAnim = requestAnimationFrame(animConfetti);
    else confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  }

  // ── Event wiring ───────────────────────────────────────────────────────────
  addBtn.addEventListener('click', () => addEntry(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(input.value); });

  list.addEventListener('click', e => {
    const btn = e.target.closest('.del-btn');
    if (btn) removeEntry(Number(btn.dataset.i));
  });

  spinBtn.addEventListener('click', spin);
  hub.addEventListener('click', spin);

  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('show');
    confParticles = [];
  });
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      overlay.classList.remove('show');
      confParticles = [];
    }
  });

  // Initial render
  renderList();
  drawWheel();
</script>
</body>
</html>
